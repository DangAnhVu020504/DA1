<div class="create-container">
    <h2>Đăng Tin Bất Động Sản Mới</h2>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="form-row">
            <div class="form-group">
                <label>Tiêu đề tin *</label>
                <input type="text" [(ngModel)]="property.title" name="title" required class="form-control"
                    placeholder="VD: Nhà phố 3 tầng Quận 7">
            </div>
        </div>

        <div class="form-row two-columns">
            <div class="form-group">
                <label>Loại giao dịch *</label>
                <select [(ngModel)]="property.listingTypeId" name="listingTypeId" required class="form-control">
                    <option [ngValue]="null">-- Chọn loại --</option>
                    <option *ngFor="let lt of listingTypes" [ngValue]="lt.id">{{ lt.name }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Loại BĐS *</label>
                <select [(ngModel)]="property.typeId" name="typeId" required class="form-control">
                    <option [ngValue]="null">-- Chọn loại BĐS --</option>
                    <option *ngFor="let pt of propertyTypes" [ngValue]="pt.id">{{ pt.name }}</option>
                </select>
            </div>
        </div>

        <div class="form-row two-columns">
            <div class="form-group">
                <label>Tỉnh/Thành phố *</label>
                <select [(ngModel)]="selectedCityId" name="cityId" (ngModelChange)="onCityChange()" required
                    class="form-control">
                    <option [ngValue]="null">-- Chọn thành phố --</option>
                    <option *ngFor="let city of cities" [ngValue]="city.id">{{ city.name }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quận/Huyện *</label>
                <select [(ngModel)]="property.districtId" name="districtId" required class="form-control"
                    [disabled]="!selectedCityId">
                    <option [ngValue]="null">-- Chọn quận/huyện --</option>
                    <option *ngFor="let d of districts" [ngValue]="d.id">{{ d.name }}</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Địa chỉ cụ thể *</label>
                <div class="address-input-group">
                    <input type="text" [(ngModel)]="property.address" name="address" required class="form-control"
                        placeholder="Số nhà, tên đường" (ngModelChange)="onAddressChange()">
                    <button type="button" class="btn-geocode" (click)="searchLocation()" [disabled]="geocoding || !property.address">
                        {{ geocoding ? '⏳ Đang tìm...' : '🔍 Tìm vị trí' }}
                    </button>
                </div>
                <small class="geocode-hint">Nhập địa chỉ để tự động định vị trên bản đồ</small>
            </div>
        </div>

        <div class="form-row two-columns">
            <div class="form-group">
                <label>Mức giá (VND) *</label>
                <input type="number" [(ngModel)]="property.price" name="price" required class="form-control">
            </div>

            <div class="form-group">
                <label>Diện tích (m²) *</label>
                <input type="number" [(ngModel)]="property.area" name="area" required class="form-control">
            </div>
        </div>

        <div class="form-row two-columns">
            <div class="form-group">
                <label>Số phòng ngủ</label>
                <input type="number" [(ngModel)]="property.bedrooms" name="bedrooms" class="form-control" min="0">
            </div>

            <div class="form-group">
                <label>Số phòng tắm</label>
                <input type="number" [(ngModel)]="property.bathrooms" name="bathrooms" class="form-control" min="0">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Mô tả chi tiết</label>
                <textarea [(ngModel)]="property.description" name="description" rows="5" class="form-control"
                    placeholder="Mô tả chi tiết về bất động sản..."></textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>📸 Hình ảnh mô tả (chọn tối đa 5 ảnh)</label>
                <input type="file" (change)="onFilesSelected($event)" accept="image/*" multiple
                    class="form-control-file">
                <div class="image-preview-grid" *ngIf="imagePreviews.length > 0">
                    <div class="image-preview-item" *ngFor="let preview of imagePreviews; let i = index">
                        <img [src]="preview" alt="Preview">
                        <button type="button" class="remove-btn" (click)="removeImage(i)">✕</button>
                    </div>
                </div>
                <small class="text-muted">Đã chọn {{ selectedFiles.length }}/5 ảnh</small>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>🎬 Video giới thiệu (MP4, WebM, MOV - tối đa 100MB)</label>
                <input type="file" (change)="onVideoSelected($event)"
                    accept="video/mp4,video/webm,video/quicktime,video/avi" class="form-control-file">
            </div>
        </div>

        <!-- Map Section — Chọn vị trí BĐS trên bản đồ -->
        <div class="form-row">
            <div class="form-group">
                <label>📍 Vị trí trên bản đồ</label>
                <div id="create-map" class="leaflet-map-container"></div>
                <!-- Geocode error -->
                <div class="geocode-error" *ngIf="geocodeError">
                    ⚠️ {{ geocodeError }}
                </div>
                <!-- Tọa độ đã chọn -->
                <div class="latlng-display" *ngIf="property.latitude && property.longitude">
                    <span>📌 Vĩ độ: <strong>{{ property.latitude }}</strong></span>
                    <span>📌 Kinh độ: <strong>{{ property.longitude }}</strong></span>
                </div>
                <small class="text-muted" *ngIf="!property.latitude">Nhập địa chỉ ở trên hoặc click vào bản đồ để chọn vị trí</small>
            </div>
        </div>

        <div class="actions">
            <button type="submit" [disabled]="!form.valid || loading" class="btn btn-primary">
                {{ loading ? 'Đang xử lý...' : '📤 Đăng Tin' }}
            </button>
            <button type="button" (click)="cancel()" class="btn btn-secondary">Hủy</button>
        </div>
    </form>
</div>
